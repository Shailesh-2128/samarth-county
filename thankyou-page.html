        /* Reusing your background animations */
        .reflector {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.1) 0%, rgba(212, 175, 55, 0) 70%);
            filter: blur(10px);
            z-index: 0;
        }

        .reflector-1 { width: 300px; height: 300px; top: -100px; right: -50px; animation: float 8s ease-in-out infinite; }
        .reflector-2 { width: 400px; height: 400px; bottom: -100px; left: -100px; animation: float 10s ease-in-out infinite reverse; }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .ty-card {
            max-width: 600px;
            width: 100%;
            background: var(--white);
            border-radius: 16px;
            padding: 50px 40px;

            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.1);
            position: relative;
            z-index: 2;
            border: 1px solid rgba(212, 175, 55, 0.2);
            animation: fadeInUp 0.8s ease-out;
        }

        .ty-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, var(--gold) 0%, var(--gold-light) 100%);
            border-radius: 16px 16px 0 0;
        }

        .check-icon-box {
            width: 100px;
            height: 100px;
            margin: 0 auto 30px;
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.1), rgba(255, 255, 255, 0.5));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(212, 175, 55, 0.3);
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.3s backwards;
        }

        .check-icon-box i {
            font-size: 48px;
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .ty-title {
            font-size: 42px;
            font-weight: 700;
            color: #222;
            margin-bottom: 15px;
            font-family: "Helvetica", sans-serif;

            line-height: 1.6;

        }

        /* Buttons matching your theme */
        .btn-group-ty {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .ty-btn-primary {
            padding: 14px 35px;
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
            color: white;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .ty-btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(212, 175, 55, 0.3);
            color: white;
        }

        .ty-btn-secondary {
            padding: 14px 35px;
            background: white;
            color: #333;
            border: 2px solid #eee;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;

        .footer-minimal a { color: #fff; text-decoration: none; }

        /* Animations */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.5); }
            to { opacity: 1; transform: scale(1); }
        }

        @media (max-width: 768px) {
            .ty-title { font-size: 32px; }
